<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #square {
            height: 100vh;
            width: 100vw;
            background-color: aqua;
        }

        button {
            font-size: 16px;
        }
    </style>
    <script type="module" src="./script.js"></script>
</head>
<body>
    <div id="square">
        <button id="randsize">Random Font Size (click)</button>
        <button id="randbg">Random Background Color (mouse over)</button>
        <button id="upsize">Larger Buttons (double-click)</button>
        <button id="downsize">Smaller Buttons (press any key)</button>
        <button id="buttonbg">Random Button Background Color (scroll wheel)</button>
    </div>
    
</body>
</html>
